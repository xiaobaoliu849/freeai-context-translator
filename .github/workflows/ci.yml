name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Build web app + server
        run: npm run build

      - name: Build extension
        run: npm run build:ext

      - name: "Sanity check: extension artifacts"
        run: |
          set -euo pipefail
          # content script must be a classic script (IIFE) — a top-level
          # `import` is a SyntaxError in MV3 content scripts and silently
          # breaks selection translation.
          if grep -q '^import ' dist/content.js; then
            echo "::error::dist/content.js contains a top-level import — MV3 content scripts must be classic scripts" >&2
            exit 1
          fi
          node --check dist/content.js
          node --check dist/background.js
          # manifest must declare module service worker and reference content artifacts
          grep -q '"type": "module"' dist/manifest.json
          grep -q '"content.js"' dist/manifest.json
          grep -q '"content.css"' dist/manifest.json
          test -s dist/content.css
          echo "extension artifacts OK"

      - name: "Sanity check: server bundle"
        run: |
          set -euo pipefail
          node --check dist-web/server.cjs
          grep -q "api/translate" dist-web/server.cjs
          echo "server bundle OK"
