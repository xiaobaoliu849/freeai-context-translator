name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Unit tests (utils, services, config)
        run: npm run test:ui

      - name: Build web app + server
        run: npm run build

      - name: Build extension
        run: npm run build:ext

      - name: "Sanity check: extension artifacts"
        run: |
          set -euo pipefail
          # content script must be a classic script (IIFE) — a top-level
          # `import` is a SyntaxError in MV3 content scripts and silently
          # breaks selection translation.
          if grep -q '^import ' dist/content.js; then
            echo "::error::dist/content.js contains a top-level import — MV3 content scripts must be classic scripts" >&2
            exit 1
          fi
          node --check dist/content.js
          node --check dist/background.js
          # manifest must declare module service worker and reference content artifacts
          grep -q '"type": "module"' dist/manifest.json
          grep -q '"content.js"' dist/manifest.json
          grep -q '"content.css"' dist/manifest.json
          test -s dist/content.css
          echo "extension artifacts OK"

      - name: "Sanity check: server bundle"
        run: |
          set -euo pipefail
          node --check dist-web/server.cjs
          grep -q "api/translate" dist-web/server.cjs
          echo "server bundle OK"

      - name: Install Chinese/Japanese/Korean fonts for visual previews
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f

      - name: Render UI 4.0 popup in headless Chrome
        if: github.event_name == 'pull_request'
        run: |
          google-chrome --version
          node scripts/capture-yumai-preview.mjs

      - name: Upload UI 4.0 visual preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: yumai-ui4-popup-screenshots
          path: preview/yumai-*
          if-no-files-found: error
          retention-days: 14

      - name: Check popup readability and real floating dictionary in Shadow DOM
        run: |
          google-chrome --version
          node scripts/check-floating-layout.mjs

      # Upload on failure too: the failure screenshot and page text are the
      # fastest way to see why a browser check broke on the runner.
      - name: Upload floating dictionary regression screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: yumai-floating-layout
          path: |
            preview/yumai-floating-*
            preview/yumai-popup-clarity-*
          if-no-files-found: error
          retention-days: 14
